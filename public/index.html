<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>나는 세계에서 몇 등? / Where Do I Rank? / 私は世界で何位？</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="alternate" hreflang="ko" href="/ko" />
    <link rel="alternate" hreflang="en" href="/en" />
    <link rel="alternate" hreflang="ja" href="/ja" />
    <link rel="alternate" hreflang="x-default" href="/en" />
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: #0f172a;
      }
      a {
        color: inherit;
        padding: 0.5rem 0.75rem;
        border: 1px solid #e2e8f0;
        border-radius: 0.375rem;
        text-decoration: none;
      }
      nav {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #020617;
          color: #f1f5f9;
        }
        a {
          border-color: #334155;
        }
      }
    </style>
    <script>
      /*
       * 브라우저 언어에 맞는 페이지로 보낸다.
       * 서버가 없는 정적 배포라서 이 일을 브라우저에서 한다.
       * 자바스크립트가 꺼져 있어도 아래 링크로 갈 수 있다.
       */
      (function () {
        try {
          var supported = ["ko", "en", "ja"];
          var list = navigator.languages || [navigator.language || "en"];
          var picked = "en";
          for (var i = 0; i < list.length; i += 1) {
            var base = String(list[i]).toLowerCase().split("-")[0];
            if (supported.indexOf(base) !== -1) {
              picked = base;
              break;
            }
          }
          location.replace("/" + picked);
        } catch (e) {
          location.replace("/en");
        }
      })();
    </script>
  </head>
  <body>
    <p>Choose a language</p>
    <nav>
      <a href="/ko" hreflang="ko">한국어</a>
      <a href="/en" hreflang="en">English</a>
      <a href="/ja" hreflang="ja">日本語</a>
    </nav>
  </body>
</html>
